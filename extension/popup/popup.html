<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprout</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><div class="brand"><span class="mark">✳</span> sprout<span class="dot"></span></div><label class="switch" title="Enable mindful prompts"><input id="enabled" type="checkbox" aria-label="Enable Sprout"><span></span></label></header>
<section class="garden"><div class="eyebrow">YOUR LITTLE MOMENT OF CALM</div><h1>Small choices.<br>Quiet growth.</h1><div id="tree" class="tree"></div><div class="stage"><span id="stage">Tiny sprout</span><span id="condition">Healthy</span></div><p id="message">A little care goes a long way.</p></section>
<section class="glass metrics"><div class="label"><span>Tree health</span><strong id="healthText"></strong></div><progress id="health" max="250" value="200" aria-label="Tree health"></progress><div class="label growth"><span id="nextLabel">Next chapter</span><strong id="xpText"></strong></div><progress id="xp" max="50" value="0" aria-label="Growth progress"></progress></section>
<section class="stats"><div><strong id="skipped">0</strong><span>videos skipped</span></div><span class="divider"></span><div><strong id="watched">0</strong><span>watched anyway</span></div></section>
<section class="glass settings"><div class="label"><label for="sensitivity">Mindful sensitivity</label><span class="hint">Your pace</span></div><div class="select"><select id="sensitivity"><option value="low">Low · fewer pauses</option><option value="medium">Medium · a gentle balance</option><option value="high">High · more pauses</option></select></div><label class="keyword-label" for="keywords">Words you’d like a pause for</label><input id="keywords" placeholder="e.g. burnout, overthinking" maxlength="2000"><div class="hint">Separate words or phrases with commas.</div></section>
<button id="simulate" class="test">Test prompt on current tab <span>↗</span></button><button id="diagnose" class="test">Check detection on this video <span>↗</span></button><button id="care" class="test">Care view & optional check-in <span>↗</span></button><div id="status" role="status" aria-live="polite"></div><footer><span class="privacy-dot"></span> Grows with you. Stays on your device.</footer></main>
<script src="../shared/storage.js"></script><script src="../shared/treeRenderer.js"></script><script src="popup.js"></script></body></html>
